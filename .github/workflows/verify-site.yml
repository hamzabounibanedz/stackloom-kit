name: Verify portfolio site
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify the application
        run: |
          npm i -g pnpm@10.8.0
          pnpm --filter @ct3a/www... install --frozen-lockfile
          pnpm --filter @ct3a/www build
          grep -Fq "Stackloom" www/dist/index.html
